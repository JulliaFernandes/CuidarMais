# Agendador de lembretes do CuidarMais (veja agendador/LEIA-ME.md).
# Grátis: o repositório é público, então o GitHub Actions não cobra minutos.
name: Agendador de lembretes

on:
  schedule:
    - cron: "*/5 * * * *" # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: # botão "Run workflow" para rodar na hora, nos testes

concurrency:
  group: agendador
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agendador/requirements.txt

      - name: Instalar dependências
        run: pip install -r agendador/requirements.txt

      - name: Testar as regras
        working-directory: agendador
        run: python -m unittest

      - name: Rodar o agendador
        run: python agendador/agendador.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
